[project]
name = "gazyar-backend"
version = "0.1.0"
description = "Gazyar API — gas consumption optimisation program (Rasht district 2)"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.143.0",
  "uvicorn[standard]==0.54.0",
  "sqlalchemy==2.1.4",
  "alembic==1.20.0",
  "pydantic==2.13.5",
  "pydantic-settings==2.15.0",
  "pyjwt==2.15.1",
  "argon2-cffi==25.1.0",
  "cryptography==50.0.2",
  "openpyxl==3.1.5",
  "pillow==12.3.0",
  "pillow-heif==1.8.1",
  "jdatetime==6.1.0",
  "httpx==0.28.1",
  "python-multipart==0.0.32",
  "psycopg[binary]==3.3.6",
  "apscheduler==3.11.3",
  "redis==8.1.0",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "pytest-cov", "ruff"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
filterwarnings = ["error::DeprecationWarning:app.*"]

[tool.ruff]
extend-exclude = ["alembic/versions"]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM"]
ignore = ["S101", "B008", "E501", "S311"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S108"]
"app/cli.py" = ["S106"]
