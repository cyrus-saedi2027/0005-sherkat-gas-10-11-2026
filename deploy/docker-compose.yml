# Production-like stack: PostgreSQL 16, Redis (rate limits), API, scheduler, nginx (both web apps).
# Usage: cp deploy/.env.example deploy/.env  →  edit secrets  →  docker compose -f deploy/docker-compose.yml up -d --build
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: gazyar
      POSTGRES_USER: gazyar
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
    volumes: [db:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U gazyar"], interval: 5s, retries: 20 }
  redis:
    image: redis:7-alpine
    restart: unless-stopped
  api:
    build: ../backend
    restart: unless-stopped
    env_file: .env
    environment:
      GAZYAR_ENV: prod
      GAZYAR_DATABASE_URL: postgresql+psycopg://gazyar:${POSTGRES_PASSWORD}@db:5432/gazyar
      GAZYAR_RATELIMIT_BACKEND: redis
      GAZYAR_REDIS_URL: redis://redis:6379/0
      GAZYAR_UPLOAD_DIR: /srv/var/uploads
      GAZYAR_COOKIE_SECURE: "true"
      GAZYAR_EXPOSE_DEV_OTP: "false"
    volumes: [uploads:/srv/var/uploads]
    depends_on: { db: { condition: service_healthy }, redis: { condition: service_started } }
  scheduler:
    build: ../backend
    restart: unless-stopped
    env_file: .env
    environment:
      GAZYAR_ENV: prod
      GAZYAR_DATABASE_URL: postgresql+psycopg://gazyar:${POSTGRES_PASSWORD}@db:5432/gazyar
      GAZYAR_EXPOSE_DEV_OTP: "false"
    volumes: [uploads:/srv/var/uploads]
    # Sends queued SMS every few seconds and releases month-end points (see app/core/scheduler.py).
    command: ["python", "-c", "import time; from app.core.scheduler import start; start(); time.sleep(10**9)"]
    depends_on: { db: { condition: service_healthy } }
  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports: ["80:80"]
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ../apps/user/dist:/usr/share/nginx/user:ro
      - ../apps/admin/dist:/usr/share/nginx/admin:ro
    depends_on: [api]
volumes:
  db: {}
  uploads: {}
